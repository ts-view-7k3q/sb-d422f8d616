name: v1-standby
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: standby
  cancel-in-progress: false
jobs:
  standby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: chk
        run: python standby.py check
      - if: steps.chk.outputs.run == 'true'
        run: pip install playwright && playwright install --with-deps chromium
      - if: steps.chk.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python standby.py run
      - run: |
          git config user.name standby
          git config user.email standby@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m state && git push)
